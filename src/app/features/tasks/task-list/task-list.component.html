<div class="page-container">
  <app-page-header title="Task Management"></app-page-header>

  <div class="toolbar">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search tasks</mat-label>
      <input matInput [(ngModel)]="searchQuery" (input)="applyFilters()" placeholder="Search by title, description or assignee">
      <mat-icon matPrefix>search</mat-icon>
    </mat-form-field>

    <div class="filters">
      <mat-form-field appearance="outline">
        <mat-label>Status</mat-label>
        <mat-select [(ngModel)]="statusFilter" (selectionChange)="applyFilters()">
          <mat-option value="all">All Statuses</mat-option>
          <mat-option value="Pending">Pending</mat-option>
          <mat-option value="In Progress">In Progress</mat-option>
          <mat-option value="Completed">Completed</mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Priority</mat-label>
        <mat-select [(ngModel)]="priorityFilter" (selectionChange)="applyFilters()">
          <mat-option value="all">All Priorities</mat-option>
          <mat-option value="Low">Low</mat-option>
          <mat-option value="Medium">Medium</mat-option>
          <mat-option value="High">High</mat-option>
        </mat-select>
      </mat-form-field>

      <button mat-raised-button color="primary" (click)="addTask()">
        <mat-icon>add</mat-icon>
        Create Task
      </button>
    </div>
  </div>

  <app-data-table 
    [columns]="columns" 
    [data]="filteredTasks"
    (view)="viewTask($event)"
    (edit)="editTask($event)"
    (delete)="deleteTask($event)">

    <ng-template #statusTemplate let-task let-key="key">
      <div class="status-quick-edit">
        <app-status-badge 
          [label]="task[key]" 
          [type]="key === 'priority' ? 'priority' : 'status'" 
          [matMenuTriggerFor]="badgeMenu" 
          class="clickable-badge">
        </app-status-badge>
        
        <mat-menu #badgeMenu="matMenu">
          @if (key === 'status') {
            <button mat-menu-item (click)="updateTaskStatus(task, 'Pending')">
              <mat-icon>hourglass_empty</mat-icon>
              <span>Pending</span>
            </button>
            <button mat-menu-item (click)="updateTaskStatus(task, 'In Progress')">
              <mat-icon>trending_up</mat-icon>
              <span>In Progress</span>
            </button>
            <button mat-menu-item (click)="updateTaskStatus(task, 'Completed')">
              <mat-icon>check_circle</mat-icon>
              <span>Completed</span>
            </button>
          } @else {
            <button mat-menu-item (click)="updateTaskPriority(task, 'Low')">
              <mat-icon>keyboard_double_arrow_down</mat-icon>
              <span>Low</span>
            </button>
            <button mat-menu-item (click)="updateTaskPriority(task, 'Medium')">
              <mat-icon>drag_handle</mat-icon>
              <span>Medium</span>
            </button>
            <button mat-menu-item (click)="updateTaskPriority(task, 'High')">
              <mat-icon>keyboard_double_arrow_up</mat-icon>
              <span>High</span>
            </button>
          }
        </mat-menu>
      </div>
    </ng-template>
  </app-data-table>
</div>
